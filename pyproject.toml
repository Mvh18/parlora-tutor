[project]
name = "parlora-workspace"
version = "0.4.0"
description = "Workspace root for Parlora: shared tooling and repository checks."
readme = "README.md"
requires-python = "==3.12.*"
dependencies = []

[dependency-groups]
dev = [
    # The HTTP client behind Starlette's TestClient (httpx is deprecated there).
    "httpx2>=2.13.1",
    "hypothesis>=6.140",
    "import-linter>=2.5",
    "mypy>=1.18",
    "pip-audit>=2.9",
    "pip-licenses>=5.0",
    "pre-commit>=4.3",
    "pytest>=8.4",
    "pytest-cov>=7.0",
    # Workspace members, installed editable so their suites run from the root.
    "parlora-core",
    "parlora-server",
    "pyyaml>=6.0",
    "ruff>=0.17",
    # The `just` binary from PyPI, so CI and contributors outside the Dev
    # Container run the same recipes with `uv run just <recipe>`.
    "rust-just>=1.58",
    # PostgreSQL in throwaway containers for the server's integration tests.
    "testcontainers[postgres]>=4.15.0",
    "types-pyyaml>=6.0",
    "zizmor>=1.10",
]
# Component benchmarks only (scripts/bench). Optional: about 2.6 GB of speech and
# CUDA wheels stay out of `just setup` and of the dev/runtime images; the bench
# recipes add it with `uv run --group bench`. Locked and audited like the rest.
bench = [
    "faster-whisper>=1.2.1",
    # CUDA 12 user-space libraries for ctranslate2 (ADR 0002); no macOS wheels.
    "nvidia-cublas-cu12>=12.9 ; sys_platform == 'linux' or sys_platform == 'win32'",
    "nvidia-cudnn-cu12>=9.27 ; sys_platform == 'linux' or sys_platform == 'win32'",
    "nvidia-ml-py>=12.575",
    "onnxruntime>=1.23",
    # Kokoro G2P without extras: misaki[en] pulls in GPL packages (ADR 0004).
    "misaki>=0.9.4",
    "spacy>=3.8,<3.9",
    "en-core-web-sm @ https://github.com/explosion/spacy-models/releases/download/en_core_web_sm-3.8.0/en_core_web_sm-3.8.0-py3-none-any.whl",
    "num2words>=0.5.14",
    "soundfile>=0.13",
    "numpy>=2.0",
    "huggingface-hub>=0.30",
]

[tool.uv]
# The root only carries tooling; packages live in the workspace members.
package = false
# Supply-chain delay: ignore releases younger than a week (pnpm does the same
# through minimumReleaseAge).
exclude-newer = "7 days"
# Security fixes skip the delay, as Dependabot's cooldown does: pin the cut-off
# for the patched package to the day of the fix and drop the entry once the
# release is older than a week.
exclude-newer-package = { certifi = "2026-10-21T00:00:00Z", virtualenv = "2026-10-21T00:00:00Z", filelock = "2026-10-18T00:00:00Z" }

[tool.uv.workspace]
members = ["packages/*", "apps/*"]
exclude = ["apps/web"]

[tool.uv.sources]
parlora-core = { workspace = true }
parlora-server = { workspace = true }

# ── ruff ────────────────────────────────────────────────────────────────────
[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = [".devcontainer"]
# First-party import roots of the workspace members (src layout).
src = [".", "packages/core/src", "apps/server/src"]

[tool.ruff.lint]
select = [
    "E", "W",  # pycodestyle
    "F",       # pyflakes
    "I",       # isort
    "N",       # pep8-naming
    "UP",      # pyupgrade
    "B",       # bugbear
    "C4",      # comprehensions
    "SIM",     # simplify
    "PT",      # pytest style
    "S",       # bandit (security)
    "RUF",     # ruff-specific
]

[tool.ruff.lint.per-file-ignores]
# Tests assert, and repository checks call git with fixed arguments.
"tests/**" = ["S101", "S603", "S607"]
"**/tests/**" = ["S101"]
# Dev scripts run tools with fixed arguments built in the script itself.
"scripts/**" = ["S603"]
# IPA symbols are meant, not look-alikes of ASCII letters.
"scripts/bench/kokoro_runner.py" = ["S603", "RUF001"]
"tests/bench/test_kokoro_runner.py" = ["S101", "S603", "S607", "RUF001"]
# Domain errors are named after the rule they enforce, as the domain-core spec does.
"packages/core/src/parlora_core/errors.py" = ["N818"]

# ── mypy ────────────────────────────────────────────────────────────────────
[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
# Typed `__init__` for pydantic models and settings (incl. `_env_file`).
plugins = ["pydantic.mypy"]
files = [
    "tests",
    "scripts",
    "packages/core/src",
    "packages/core/tests",
    "apps/server/src",
    "apps/server/tests",
    "apps/server/alembic/env.py",
]

# Libraries of the optional bench group: not installed by default and untyped.
[[tool.mypy.overrides]]
module = [
    "ctranslate2.*",
    "faster_whisper.*",
    "misaki.*",
    "numpy.*",
    "onnxruntime.*",
    "pynvml",
    "soundfile",
]
ignore_missing_imports = true

# ── pytest ──────────────────────────────────────────────────────────────────
[tool.pytest.ini_options]
minversion = "8.4"
testpaths = ["tests"]
addopts = ["--strict-markers", "--strict-config", "-ra"]
xfail_strict = true
markers = [
    "unit: fast, isolated tests",
    "integration: tests that need real services (Docker, PostgreSQL)",
    "contract: API contract checks (OpenAPI, generated clients)",
    "gpu: tests that need an NVIDIA GPU; excluded in CI",
    "slow: tests that take more than a few seconds",
]

# ── coverage ────────────────────────────────────────────────────────────────
# Per-package thresholds are set by the test recipes of each package.
[tool.coverage.run]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true
exclude_also = ["if TYPE_CHECKING:", "raise NotImplementedError", "@overload"]

# ── import-linter ───────────────────────────────────────────────────────────
# The domain core stays framework-free (design D5), and the server is layered:
# a layer may import the layers below it, never the ones above.
[tool.importlinter]
root_packages = ["parlora_core", "parlora_server"]
include_external_packages = true

[[tool.importlinter.contracts]]
name = "parlora_core is framework-free"
type = "forbidden"
source_modules = ["parlora_core"]
forbidden_modules = ["fastapi", "starlette", "pydantic", "sqlalchemy", "pipecat", "parlora_server"]
allow_indirect_imports = false

[[tool.importlinter.contracts]]
name = "parlora_server layers"
type = "layers"
containers = ["parlora_server"]
layers = ["main", "api", "db", "config"]
