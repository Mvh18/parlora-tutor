[project]
name = "parlora-server"
version = "0.5.0"
description = "Parlora server: the versioned HTTP API (FastAPI) in front of the domain core."
readme = "README.md"
requires-python = "==3.12.*"
license = "LicenseRef-PolyForm-Noncommercial-1.0.0"
dependencies = [
    "alembic>=1.20.0",
    "asyncpg>=0.32.0",
    "fastapi>=0.143.2",
    "parlora-core",
    "pydantic-settings>=2.16.0",
    "sqlalchemy[asyncio]>=2.1.4",
    "uvicorn>=0.54.0",
    # Voice pipeline. Pinned to one minor version: Pipecat's API moves fast.
    # Silero VAD and Smart Turn v3 ship in the base package; the `kokoro` extra
    # is not used because kokoro-onnx pulls in GPL code (ADR 0004).
    "pipecat-ai[webrtc,silero]>=1.15,<1.16",
# Pipecat logs through loguru; the server sets its level (parlora_server.logs).
"loguru>=0.7.3",
    "faster-whisper>=1.2.1",
    # CUDA 12 user-space libraries for ctranslate2 (ADR 0002); no macOS wheels.
    "nvidia-cublas-cu12>=12.9 ; sys_platform == 'linux' or sys_platform == 'win32'",
    "nvidia-cudnn-cu12>=9.27 ; sys_platform == 'linux' or sys_platform == 'win32'",
    # Kokoro on the GPU: the GPU build also has the CPU provider and brings its
    # CUDA 13 libraries as wheels. macOS has no GPU build. The root pyproject
    # overrides the CPU `onnxruntime` other packages ask for: both builds install
    # the same `onnxruntime` module.
    "onnxruntime-gpu[cuda,cudnn]>=1.31.1 ; sys_platform == 'linux' or sys_platform == 'win32'",
    "onnxruntime>=1.24.3 ; sys_platform == 'darwin'",
    # Kokoro G2P without extras: misaki[en] pulls in GPL packages (ADR 0004).
    "misaki>=0.9.4",
    "spacy>=3.8,<3.9",
    "en-core-web-sm @ https://github.com/explosion/spacy-models/releases/download/en_core_web_sm-3.8.0/en_core_web_sm-3.8.0-py3-none-any.whl",
    "num2words>=0.5.14",
    "soundfile>=0.13",
    "numpy>=2.0",
    "huggingface-hub>=0.30",
    # HTTP client of the Ollama adapter (already in the lock through huggingface-hub).
    "httpx2>=2.13.1",
]

[build-system]
requires = ["uv_build>=0.13.0,<0.14"]
build-backend = "uv_build"

[tool.uv.sources]
parlora-core = { workspace = true }
