# Dependency review on pull requests. Required for npm, Docker and Actions;
# for Python the required gate is scripts/audit_python_deps.py, because
# GitHub's support for uv.lock is unverified (ADR 0005). Licence policy:
# ADR 0004 — no GPL or AGPL; MPL-2.0 allowed; LGPL only for reviewed packages.
fail-on-severity: high
fail-on-scopes: [runtime, development]
comment-summary-in-pr: never

allow-licenses:
  - 0BSD
  - Apache-2.0
  - BlueOak-1.0.0
  - BSD-2-Clause
  - BSD-3-Clause
  - BSL-1.0
  - CC-BY-4.0
  - CC0-1.0
  # Permissive notice of Markus Kuhn's original wcwidth code (via prettytable).
  - HPND-Markus-Kuhn
  - ISC
  - MIT
  - MIT-0
  - MPL-2.0
  - PSF-2.0
  - Python-2.0
  - Unicode-3.0
  - Unlicense
  - Zlib

# Reviewed exceptions; keep in sync with scripts/audit_python_deps.py.
allow-dependencies-licenses:
  # LGPL, used unmodified through normal imports (ADR 0004).
  - pkg:pypi/soxr
  - pkg:pypi/num2words
  # NVIDIA's CUDA wheels of the optional bench group: proprietary (GitHub
  # reports NOASSERTION), installed locally and never redistributed (NOTICE).
  - pkg:pypi/nvidia-cublas-cu12
  - pkg:pypi/nvidia-cuda-nvrtc-cu12
  - pkg:pypi/nvidia-cudnn-cu12
  # Permissive, but reported as compound expressions outside the list above:
  # protobuf is BSD-3-Clause plus Google's BSD-style protobuf notice, and regex
  # is Apache-2.0 plus CNRI-Python code from CPython's sre engine.
  - pkg:pypi/protobuf
  - pkg:pypi/regex

# GPL grapheme-to-phoneme packages that must never enter the process.
deny-packages:
  - pkg:pypi/phonemizer
  - pkg:pypi/phonemizer-fork
  - pkg:pypi/espeakng-loader
